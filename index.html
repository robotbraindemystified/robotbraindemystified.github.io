@media(max-width:560px){main{padding:30px 24px 24px;max-width:440px}h1{width:100%}.desc{max-width:30ch;margin-top:14px;font-size:17px;line-height:1.55}.triad{margin-top:18px;gap:12px;font-size:10px}.links{grid-template-columns:1fr;margin-top:28px;gap:10px}.links a{flex-direction:row;justify-content:flex-start;gap:16px;min-height:76px;padding:14px 20px;border-radius:13px}.links .meta{align-items:flex-start;gap:3px}.links .lbl{font-size:15px}.links .hd{font-size:12px}.links a svg{width:24px;height:24px}.contact{margin-top:25px;gap:4px}.contact a{font-size:13px;gap:7px}footer{margin-top:20px}}
